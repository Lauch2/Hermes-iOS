name: Build Unsigned iOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .app for Simulator
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project from project.yml (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project HermesMobile.xcodeproj \
            -scheme HermesMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            -quiet

      - name: Find built .app
        run: |
          find build -name "HermesMobile.app" -type d
          APP_PATH=$(find build -name "HermesMobile.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Zip .app for upload
        run: |
          cd "$(dirname "$APP_PATH")"
          zip -r HermesMobile-unsigned.zip "$(basename "$APP_PATH")"

      - name: Upload unsigned .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesMobile-unsigned-simulator
          path: build/**/HermesMobile-unsigned.zip
          retention-days: 7